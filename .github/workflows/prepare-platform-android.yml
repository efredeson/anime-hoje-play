name: Preparar Android API para compilação local
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/prepare-platform-android.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar Android SDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          "$SDKMANAGER" 'platforms;android-35'
          mkdir -p export
          cp "${ANDROID_HOME}/platforms/android-35/android.jar" export/android.jar
      - name: Entregar android.jar (sem APK proprietário)
        uses: actions/upload-artifact@v4
        with:
          name: android-api-35-compile-tool
          path: export/android.jar
          retention-days: 1
          compression-level: 0
