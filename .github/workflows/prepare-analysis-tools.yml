name: Preparar ferramenta Android para análise local

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/prepare-analysis-tools.yml

permissions:
  contents: read

jobs:
  download-jadx:
    runs-on: ubuntu-latest
    steps:
      - name: Obter CLI Jadx público
        run: |
          curl -fL --retry 3 --connect-timeout 15 -o jadx.zip \
            https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          unzip -q jadx.zip -d jadx
          test -f jadx/bin/jadx
          ls -lah jadx/lib | head -15
      - name: Publicar análise CLI (somente ferramenta, sem APK)
        uses: actions/upload-artifact@v4
        with:
          name: jadx-cli-1-5-6
          path: |
            jadx/bin
            jadx/lib
          retention-days: 2
          compression-level: 0
